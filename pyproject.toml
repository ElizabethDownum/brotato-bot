[project]
name = "brotato-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brotato_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["mod", "tools", "data"]

[tool.ruff.lint.per-file-ignores]
# Folded upstream Spud Coach code is kept verbatim (see learnings/upstream.md).
"brotato_bot/dataset/spud/**" = ["I001", "FURB188", "RUF100"]
"tests/dataset/test_build_*.py" = ["I001"]
